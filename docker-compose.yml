version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: vitalroute_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_NAME:-vitalroute}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Los scripts en /docker-entrypoint-initdb.d se ejecutarán automáticamente al crear la DB por primera vez
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/procedures.sql:/docker-entrypoint-initdb.d/02_procedures.sql
    networks:
      - vitalroute_network

volumes:
  db_data:

networks:
  vitalroute_network:
    driver: bridge
